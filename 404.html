<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Mausam Giri">
  <link rel="author" href="https://mausamgiri.in">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">
  <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet">
  <link rel="icon" href="https://mausamgiri.in/favicon.ico">
  <title>404 - Page Not Found</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    #overlay {
      mask-image: radial-gradient(
          circle 120px at 50% 50%,
          transparent 0%,
          black 150px
      );
      -webkit-mask-image: radial-gradient(
          circle 120px at 50% 50%,
          transparent 0%,
          black 150px
      );
    }
  </style>
</head>
<body>
  <div class="relative w-screen h-screen bg-gray-900 text-white overflow-hidden">
    <div class="absolute inset-0 flex flex-col items-center justify-center z-10">
        <h1 class="text-6xl font-bold mb-4">Page Not Found</h1>
        <p class="text-xl">
            Sorry, we couldn’t find the page you’re looking for.
        </p>
        <a href="/" class="mt-6 px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded">Go Home</a>
    </div>
    <div id="overlay" class="absolute inset-0 bg-black z-20 pointer-events-none">
    </div>

    <script>
      const overlay = document.getElementById("overlay");
        window.addEventListener("mousemove", (e) => {
          const x = e.clientX;
          const y = e.clientY;
          const pos = `${x}px ${y}px`;
          overlay.style.maskImage = `radial-gradient(circle 120px at ${pos}, transparent 0%, black 150px)`;
          overlay.style.webkitMaskImage = overlay.style.maskImage;
      });
    </script>
</body>
</html>
