<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldSkills India - Smart Checklist</title>
    <meta name="author" content="Mausam Giri">
    <link rel="author" href="https://mausamgiri.in">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link rel="icon" href="https://mausamgiri.in/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' }
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            --bg: #07090d;
            --text: #f5f7fa;
            --muted: #8b949e;
            --border: rgba(255, 255, 255, 0.08);
            --surface: rgba(10, 12, 16, 0.65);
        }

        html,
        body {
            background: var(--bg);
            color: var(--text);
        }

        body {
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: linear-gradient(to bottom, black, rgba(0, 0, 0, 0.7), transparent);
        }

        .orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.18;
            animation: float 12s ease-in-out infinite;
        }

        .orb.one {
            top: -180px;
            left: -120px;
            background: #3b82f6;
        }

        .orb.two {
            bottom: -250px;
            right: -150px;
            background: #8b5cf6;
            animation-delay: -6s;
        }

        .orb.three {
            top: 35%;
            left: 55%;
            width: 300px;
            height: 300px;
            background: #06b6d4;
            opacity: 0.1;
            animation-delay: -3s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(50px, 40px);
            }
        }

        .code {
            position: absolute;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 13px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.07);
            user-select: none;
        }

        .code-left {
            top: 18%;
            left: 7%;
        }

        .code-right {
            bottom: 20%;
            right: 7%;
            text-align: right;
        }

        .page-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 100vh;
        }

        @media (max-width: 700px) {
            .code {
                display: none;
            }

            .orb {
                transform: scale(0.7);
            }
        }

        .transition-all-300 {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-checkbox input:checked+div {
            background-color: #2563eb;
            border-color: #2563eb;
        }

        .custom-checkbox input:checked+div svg {
            display: block;
        }

        .item-row {
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .item-row:hover {
            background-color: rgba(255, 255, 255, 0.04);
        }

        .item-row.flag-red {
            background-color: rgba(239, 68, 68, 0.1);
        }

        .item-row.flag-red:hover {
            background-color: rgba(239, 68, 68, 0.16);
        }

        .item-row.flag-yellow {
            background-color: rgba(234, 179, 8, 0.1);
        }

        .item-row.flag-yellow:hover {
            background-color: rgba(234, 179, 8, 0.16);
        }

        .item-row.flag-green {
            background-color: rgba(34, 197, 94, 0.1);
        }

        .item-row.flag-green:hover {
            background-color: rgba(34, 197, 94, 0.16);
        }

        .item-completed .item-text {
            text-decoration: line-through;
            color: #64748b;
        }

        .item-completed .item-desc {
            color: #475569;
        }

        .material-icon {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 1.125rem;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .material-icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .subsection-toggle .collapse-icon {
            transition: transform 0.2s ease;
        }

        .subsection-toggle.is-collapsed .collapse-icon {
            transform: rotate(-90deg);
        }

        @keyframes modalPop {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-animate {
            animation: modalPop 0.2s ease-out forwards;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="background">
            <div class="grid"></div>
            <div class="orb one"></div>
            <div class="orb two"></div>
            <div class="orb three"></div>
            <div class="code code-left">
                target = <span id="code-target-ts"></span>;<br>
                now = <span id="code-now-ts"></span>;<br>
                delta = <span id="code-delta-ts"></span>;<br>
                // <span id="code-remaining"></span>
            </div>
            <div class="code code-right">
                 const eta = "2 weeks";<br />
                // narrator: it was not<br />
                <br />
                if (worksOnMyMachine) {<br />
                &nbsp;&nbsp;deployToProd();<br />
                }
            </div>
        </div>

        <div class="page-content">
            <header class="sticky top-0 z-40 bg-[rgba(10,12,16,0.8)] backdrop-blur-md border-b border-white/[0.08]">
                <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white font-bold shadow-md shadow-brand-500/30">
                            W</div>
                        <div>
                            <h1 class="text-sm font-bold text-[#f5f7fa] leading-none">WSC 2026 Checklist</h1>
                            <p class="text-[10px] font-medium text-[#8b949e] uppercase tracking-wider">Pre-Departure</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="text-right hidden sm:block">
                            <p class="text-[10px] font-bold text-[#8b949e] uppercase">Progress</p>
                            <p class="text-xs font-bold text-brand-500 tabular-nums"><span id="progress-text">0%</span>
                            </p>
                        </div>
                        <div class="w-24 h-1.5 bg-white/10 rounded-full overflow-hidden">
                            <div id="progress-fill" class="h-full bg-brand-500 rounded-full transition-all duration-500"
                                style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="max-w-4xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto no-scrollbar">
                    <button onclick="setFilter('all')" id="btn-all"
                        class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-brand-600 text-white transition-colors shadow-md shadow-brand-500/20">All
                        Items</button>
                    <button onclick="setFilter('pending')" id="btn-pending"
                        class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white/5 border border-white/10 text-[#8b949e] hover:bg-white/10 transition-colors">Pending</button>
                    <button onclick="setFilter('completed')" id="btn-completed"
                        class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white/5 border border-white/10 text-[#8b949e] hover:bg-white/10 transition-colors">Completed</button>
                </div>
            </header>

            <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-6">
                <div id="checklist-container" class="space-y-8">
                </div>
            </main>

            <footer class="py-6 text-center border-t border-white/[0.08] bg-white/[0.015] backdrop-blur-[15px]">
                <a href="https://mausamgiri.in" target="_blank" rel="noopener noreferrer"
                    class="text-xs text-[#8b949e] hover:text-[#f5f7fa] transition-colors">Mausam Giri</a>
            </footer>
        </div>
    </div>

    <div id="note-modal"
        class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div
            class="bg-[rgba(14,16,22,0.95)] rounded-2xl shadow-xl w-full max-w-sm p-6 modal-animate border border-white/10 backdrop-blur-xl">
            <h3 class="text-lg font-bold text-[#f5f7fa] mb-2">Add Note</h3>
            <p id="note-item-title" class="text-sm text-[#8b949e] mb-4">For: Item Name</p>
            <textarea id="note-input"
                class="w-full p-3 bg-white/5 border border-white/10 rounded-xl text-sm text-[#f5f7fa] placeholder-[#8b949e] focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none h-32"
                placeholder="Type your reminder here..."></textarea>
            <div class="flex justify-end gap-2 mt-4">
                <button onclick="closeNoteModal()"
                    class="px-4 py-2 text-sm font-medium text-[#8b949e] hover:bg-white/10 rounded-lg transition-colors">Cancel</button>
                <button onclick="saveNote()"
                    class="px-4 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg transition-colors shadow-md shadow-brand-500/20">Save
                    Note</button>
            </div>
        </div>
    </div>

    <script>
        const checklistData = [
            {
                id: "travel-docs",
                title: "Travel & Documents",
                icon: "M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z",
                subsections: [
                    {
                        name: "Domestic Travel",
                        items: [
                            { id: "govt-id", title: "Valid Government ID", desc: "Original ID for domestic transit" },
                            { id: "flight-tickets-domestic", title: "Flight Tickets", desc: "Physical or Digital copies" },
                            { id: "emergency-contact", title: "Emergency Contacts", desc: "Keep accessible at all times" }
                        ]
                    },
                    {
                        name: "International Travel",
                        items: [
                            { id: "passport", title: "Passport", desc: "Must not expire within 6 months. DO NOT pack in checked baggage." },
                            { id: "china-visa", title: "China Visa", desc: "Confirmed visa - Physical & digital copies." },
                            { id: "travel-insurance", title: "Travel Insurance", desc: "Policy document with coverage details" },
                            { id: "invitation-letter", title: "Invitation Letter", desc: "Official WorldSkills Competition invitation" },
                            { id: "flight-tickets-intl", title: "International Flight Tickets", desc: "Boarding passes & complete itinerary" }
                        ]
                    }
                ]
            },
            {
                id: "packing",
                title: "Packing Essentials",
                icon: "M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10",
                subsections: [
                    {
                        name: "Clothing & General",
                        items: [
                            { id: "safety-shoes", title: "Safety shoes", desc: "If needed for your competition" },
                            { id: "white-socks", title: "White socks", desc: "4-6 pairs" },
                            { id: "undergarments", title: "Undergarments", desc: "4-6 pairs" }
                        ]
                    },
                    {
                        name: "Health & Hygiene",
                        items: [
                            { id: "medications", title: "Medications", desc: "Pack in carry-on" },
                            { id: "toiletries", title: "Toiletries", desc: "Pack in carry-on" },
                            { id: "first-aid", title: "First-Aid Kit", desc: "Basic supplies" },
                            { id: "sunscreen", title: "Sunscreen", desc: "SPF 50+" },
                            { id: "wet-wipes", title: "Wet Wipes", desc: "Travel pack" },
                            { id: "hand-sanitizer", title: "Hand Sanitizer", desc: "< 100ml for carry-on" },
                            { id: "deodorant", title: "Deodorant", desc: "Roll-on preferred" },
                            { id: "tissues", title: "Tissues", desc: "Pocket pack" },
                            { id: "pain-relief", title: "Pain Relief", desc: "Paracetamol/Ibuprofen" }
                        ]
                    },
                    {
                        name: "Food (Personal)",
                        items: [
                            { id: "dry-snacks", title: "Dry Snacks", desc: "Commercially packaged" },
                            { id: "energy-bars", title: "Energy Bars", desc: "High protein" },
                            { id: "nuts-seeds", title: "Nuts & Seeds", desc: "Almonds/Walnuts" },
                            { id: "tea-coffee", title: "Tea & Coffee", desc: "Sachets" },
                            { id: "biscuits", title: "Biscuits", desc: "Glucose/Digestive" }
                        ]
                    }
                ]
            },
            {
                id: "nsdc-items",
                title: "NSDC Provided Items",
                icon: "M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4",
                subsections: [
                    {
                        name: "Ceremonial & Comp Attire",
                        items: [
                            { id: "tracksuit", title: "Track suit / sweatshirt", desc: "Provided by NSDC" },
                            { id: "trousers-shoes", title: "Trousers / formal shoes", desc: "For opening ceremony" }
                        ]
                    },
                    {
                        name: "Luggage & Accessories",
                        items: [
                            { id: "cabin-trolley", title: "Cabin trolley / bag", desc: "Check dimensions" },
                            { id: "accessories", title: "Accessories Kit", desc: "Lapel pins / adaptor / umbrella" },
                            { id: "table-flag", title: "Table flag", desc: "For accommodation" }
                        ]
                    },
                    {
                        name: "Currency",
                        items: [
                            { id: "foreign-currency", title: "Foreign Currency", desc: "USD/CNY small denominations" }
                        ]
                    }
                ]
            },
            {
                id: "info",
                title: "Itinerary & Info",
                icon: "M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z M15 11a3 3 0 11-6 0 3 3 0 016 0z",
                subsections: [
                    {
                        name: "Accommodation",
                        items: [
                            { id: "hotel-info", title: "Vienna International Hotel", desc: "Shanghai Hongqiao" }
                        ]
                    }
                ]
            }
        ];

        let appState = {
            checks: {},
            flags: {},
            notes: {},
            filter: 'all',
            collapsed: {}
        };

        let currentNoteItemId = null;

        function init() {
            loadState();
            render();
            startCodeCountdown();
        }

        function loadState() {
            const saved = localStorage.getItem('wsc-smart-checklist');
            if (saved) {
                const parsed = JSON.parse(saved);
                appState.checks = parsed.checks || {};
                appState.flags = parsed.flags || {};
                appState.notes = parsed.notes || {};
                appState.collapsed = parsed.collapsed || {};
            }
        }

        function saveState() {
            localStorage.setItem('wsc-smart-checklist', JSON.stringify({
                checks: appState.checks,
                flags: appState.flags,
                notes: appState.notes,
                collapsed: appState.collapsed
            }));
            updateProgress();
        }

        function getAllItems() {
            return checklistData.flatMap(section =>
                section.subsections.flatMap(sub => sub.items)
            );
        }

        function matchesFilter(item) {
            if (appState.filter === 'all') return true;
            if (appState.filter === 'completed') return !!appState.checks[item.id];
            if (appState.filter === 'pending') return !appState.checks[item.id];
            return true;
        }

        function getSubsectionKey(sectionId, subsectionName) {
            return `${sectionId}::${subsectionName}`;
        }

        function toggleSubsection(key) {
            appState.collapsed[key] = !appState.collapsed[key];
            saveState();
            render();
        }

        function render() {
            const container = document.getElementById('checklist-container');
            container.innerHTML = '';

            checklistData.forEach(section => {
                const subsectionsHtml = section.subsections.map(subsection => {
                    const filteredItems = subsection.items.filter(matchesFilter);
                    if (filteredItems.length === 0) return '';

                    const subKey = getSubsectionKey(section.id, subsection.name);
                    const isCollapsed = !!appState.collapsed[subKey];

                    return `
                        <div class="mb-4 last:mb-0 rounded-2xl border border-white/[0.08] shadow-sm overflow-hidden bg-[rgba(10,12,16,0.65)] backdrop-blur-xl">
                            <button type="button" onclick="toggleSubsection('${subKey}')" class="subsection-toggle w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-white/[0.03] hover:bg-white/[0.06] border-b border-white/[0.06] transition-colors ${isCollapsed ? 'is-collapsed' : ''}">
                                <span class="text-xs font-semibold text-[#8b949e] uppercase tracking-wider">${subsection.name}</span>
                                <span class="material-icon collapse-icon text-[#64748b]">expand_more</span>
                            </button>
                            <div class="${isCollapsed ? 'hidden' : ''}">
                                ${filteredItems.map(item => createItemHTML(item)).join('')}
                            </div>
                        </div>
                    `;
                }).join('');

                if (!subsectionsHtml.trim()) return;

                container.innerHTML += `
                    <div class="animate-fade-in-up">
                        <h2 class="text-sm font-bold text-[#8b949e] uppercase tracking-widest mb-3 pl-1">${section.title}</h2>
                        ${subsectionsHtml}
                    </div>
                `;
            });

            updateProgress();
            updateFilterButtons();
        }

        function createItemHTML(item) {
            const isChecked = !!appState.checks[item.id];
            const flagColor = appState.flags[item.id];
            const hasNote = !!appState.notes[item.id];
            const desc = item.desc
                ? `<p class="item-desc text-xs text-[#8b949e] truncate">${item.desc}</p>`
                : '';

            const flagBgClass = flagColor ? `flag-${flagColor}` : '';
            const flagBtnColor = flagColor === 'red' ? 'text-red-400' : flagColor === 'yellow' ? 'text-yellow-400' : flagColor === 'green' ? 'text-green-400' : 'text-[#64748b]';

            return `
            <div class="item-row group flex items-center gap-3 p-4 border-b border-white/[0.06] last:border-0 ${isChecked ? 'item-completed' : ''} ${flagBgClass}" id="row-${item.id}" onclick="toggleCheck('${item.id}')">
                
                <div class="custom-checkbox relative flex items-center pointer-events-none">
                    <input type="checkbox" class="hidden" ${isChecked ? 'checked' : ''} tabindex="-1">
                    <div class="w-5 h-5 border-2 border-white/20 rounded-md flex items-center justify-center transition-all bg-white/5">
                        <svg class="w-3 h-3 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                </div>

                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2">
                        <p class="item-text text-sm font-semibold text-[#f5f7fa] truncate">${item.title}</p>
                        ${hasNote ? `<span class="material-icon material-icon-filled text-brand-500 text-base flex-shrink-0" title="Has comment">chat_bubble</span>` : ''}
                    </div>
                    ${desc}
                </div>

                <div class="flex items-center gap-0.5 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity" onclick="event.stopPropagation()">
                    <div class="relative flag-menu-wrapper">
                        <button type="button" onclick="toggleFlagMenu(event, '${item.id}')" class="p-1.5 ${flagBtnColor} hover:bg-white/10 rounded-lg transition-colors" aria-label="Flag item">
                            <span class="material-icon ${flagColor ? 'material-icon-filled' : ''}">flag</span>
                        </button>
                        <div id="flag-menu-${item.id}" class="hidden absolute right-0 top-full mt-1 bg-[rgba(14,16,22,0.95)] border border-white/10 shadow-lg rounded-lg p-1.5 z-10 flex gap-1.5 backdrop-blur-xl">
                            <button type="button" onclick="setFlag('${item.id}', 'red')" class="w-7 h-7 rounded-full bg-red-500 hover:scale-110 transition-transform" aria-label="Red flag"></button>
                            <button type="button" onclick="setFlag('${item.id}', 'yellow')" class="w-7 h-7 rounded-full bg-yellow-400 hover:scale-110 transition-transform" aria-label="Yellow flag"></button>
                            <button type="button" onclick="setFlag('${item.id}', 'green')" class="w-7 h-7 rounded-full bg-green-500 hover:scale-110 transition-transform" aria-label="Green flag"></button>
                            <button type="button" onclick="setFlag('${item.id}', null)" class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-[#8b949e] hover:bg-white/20" aria-label="Remove flag">
                                <span class="material-icon text-base">close</span>
                            </button>
                        </div>
                    </div>

                    <button type="button" onclick="openNoteModal('${item.id}')" class="p-1.5 ${hasNote ? 'text-brand-500' : 'text-[#64748b]'} hover:text-brand-500 hover:bg-white/10 rounded-lg transition-colors" aria-label="Add comment">
                        <span class="material-icon ${hasNote ? 'material-icon-filled' : ''}">add_comment</span>
                    </button>
                </div>
            </div>
            `;
        }

        function toggleCheck(id) {
            appState.checks[id] = !appState.checks[id];
            saveState();
            render();
        }

        function toggleFlagMenu(event, id) {
            event.stopPropagation();
            document.querySelectorAll('[id^="flag-menu-"]').forEach(el => {
                if (el.id !== `flag-menu-${id}`) el.classList.add('hidden');
            });
            document.getElementById(`flag-menu-${id}`).classList.toggle('hidden');
        }

        function setFlag(id, color) {
            if (color) {
                appState.flags[id] = color;
            } else {
                delete appState.flags[id];
            }
            saveState();
            render();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.flag-menu-wrapper')) {
                document.querySelectorAll('[id^="flag-menu-"]').forEach(el => el.classList.add('hidden'));
            }
        });

        function openNoteModal(id) {
            currentNoteItemId = id;
            const itemTitle = getAllItems().find(i => i.id === id)?.title || 'Item';
            document.getElementById('note-item-title').textContent = `For: ${itemTitle}`;
            document.getElementById('note-input').value = appState.notes[id] || '';
            document.getElementById('note-modal').classList.remove('hidden');
        }

        function closeNoteModal() {
            document.getElementById('note-modal').classList.add('hidden');
            currentNoteItemId = null;
        }

        function saveNote() {
            if (currentNoteItemId) {
                const text = document.getElementById('note-input').value.trim();
                if (text) {
                    appState.notes[currentNoteItemId] = text;
                } else {
                    delete appState.notes[currentNoteItemId];
                }
                saveState();
                render();
                closeNoteModal();
            }
        }

        function setFilter(type) {
            appState.filter = type;
            render();
        }

        function updateFilterButtons() {
            ['all', 'pending', 'completed'].forEach(type => {
                const btn = document.getElementById(`btn-${type}`);
                if (appState.filter === type) {
                    btn.className = "filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-brand-600 text-white transition-colors shadow-md shadow-brand-500/20";
                } else {
                    btn.className = "filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white/5 border border-white/10 text-[#8b949e] hover:bg-white/10 transition-colors";
                }
            });
        }

        function updateProgress() {
            const allItems = getAllItems();
            const checkedCount = allItems.filter(i => appState.checks[i.id]).length;
            const percentage = Math.round((checkedCount / allItems.length) * 100);

            document.getElementById('progress-fill').style.width = `${percentage}%`;
            document.getElementById('progress-text').textContent = `${percentage}%`;
        }

        function startCodeCountdown() {
            const targetDate = new Date('September 19, 2026 00:00:00');
            const targetTs = Math.floor(targetDate.getTime() / 1000);
            const elTarget = document.getElementById('code-target-ts');
            const elNow = document.getElementById('code-now-ts');
            const elDelta = document.getElementById('code-delta-ts');
            const elRemaining = document.getElementById('code-remaining');

            elTarget.textContent = targetTs;

            function update() {
                const nowDate = new Date();
                const nowTs = Math.floor(nowDate.getTime() / 1000);
                const delta = Math.max(targetTs - nowTs, 0);
                const d = Math.floor(delta / 86400);
                const h = Math.floor((delta % 86400) / 3600);
                const m = Math.floor((delta % 3600) / 60);
                const s = delta % 60;

                elNow.textContent = nowTs;
                elDelta.textContent = delta;
                elRemaining.textContent = `${d}d ${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
            }

            update();
            setInterval(update, 1000);
        }

        function startCountdown() {
            const targetDate = new Date('September 19, 2026 00:00:00').getTime();
            const container = document.getElementById('countdown');

            container.innerHTML = `
                <div class="flex flex-col items-center"><div class="w-14 h-14 sm:w-16 sm:h-16 rounded-xl bg-[rgba(10,12,16,0.65)] border border-white/[0.08] shadow-sm flex items-center justify-center mb-1.5 backdrop-blur-xl"><span id="days" class="text-xl sm:text-2xl font-black text-[#f5f7fa] tabular-nums">00</span></div><span class="text-[9px] font-bold text-[#8b949e] uppercase">Days</span></div>
                <span class="text-xl text-white/20 font-light pb-4">:</span>
                <div class="flex flex-col items-center"><div class="w-14 h-14 sm:w-16 sm:h-16 rounded-xl bg-[rgba(10,12,16,0.65)] border border-white/[0.08] shadow-sm flex items-center justify-center mb-1.5 backdrop-blur-xl"><span id="hours" class="text-xl sm:text-2xl font-black text-[#f5f7fa] tabular-nums">00</span></div><span class="text-[9px] font-bold text-[#8b949e] uppercase">Hours</span></div>
                <span class="text-xl text-white/20 font-light pb-4">:</span>
                <div class="flex flex-col items-center"><div class="w-14 h-14 sm:w-16 sm:h-16 rounded-xl bg-[rgba(10,12,16,0.65)] border border-white/[0.08] shadow-sm flex items-center justify-center mb-1.5 backdrop-blur-xl"><span id="minutes" class="text-xl sm:text-2xl font-black text-[#f5f7fa] tabular-nums">00</span></div><span class="text-[9px] font-bold text-[#8b949e] uppercase">Mins</span></div>
                <span class="text-xl text-white/20 font-light pb-4">:</span>
                <div class="flex flex-col items-center"><div class="w-14 h-14 sm:w-16 sm:h-16 rounded-xl bg-[rgba(10,12,16,0.65)] border border-white/[0.08] shadow-sm flex items-center justify-center mb-1.5 backdrop-blur-xl"><span id="seconds" class="text-xl sm:text-2xl font-black text-[#f5f7fa] tabular-nums">00</span></div><span class="text-[9px] font-bold text-[#8b949e] uppercase">Secs</span></div>
            `;

            function update() {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance < 0) {
                    ['days', 'hours', 'minutes', 'seconds'].forEach(id => document.getElementById(id).textContent = '00');
                    return;
                }

                const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = String(d).padStart(2, '0');
                document.getElementById('hours').textContent = String(h).padStart(2, '0');
                document.getElementById('minutes').textContent = String(m).padStart(2, '0');
                document.getElementById('seconds').textContent = String(s).padStart(2, '0');
            }

            update();
            setInterval(update, 1000);
        }

        init();
    </script>
</body>

</html>
