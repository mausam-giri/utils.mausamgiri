<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldSkills India - Smart Checklist</title>
    <meta name="author" content="Mausam Giri">
    <link rel="author" href="https://mausamgiri.in">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link rel="icon" href="https://mausamgiri.in/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Roboto', 'sans-serif'] },
                    colors: {
                        brand: { 300: '#7986cb', 500: '#3f51b5', 600: '#3949ab', 700: '#303f9f' }
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="/ws-pre-departure/styles.css">
</head>

<body>
    <div class="page">
        <header>
            <div class="header-inner">
                <div class="header-top">
                    <div class="header-title">
                        <h1>WSC 2026 Checklist</h1>
                        <p>Pre-Departure</p>
                    </div>
                    <div class="header-meta">
                        <span id="countdown" class="countdown"></span>
                        <div class="progress-wrap">
                            <span id="progress-text">0%</span>
                            <div class="progress-track">
                                <div id="progress-fill" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="filter-row">
                    <button type="button" onclick="setFilter('all')" id="btn-all" class="filter-btn is-active">All</button>
                    <button type="button" onclick="setFilter('pending')" id="btn-pending" class="filter-btn">Pending</button>
                    <button type="button" onclick="setFilter('completed')" id="btn-completed" class="filter-btn">Completed</button>
                </div>
            </div>
        </header>

        <main>
            <div id="checklist-container"></div>
        </main>

        <footer>
            <div class="footer-inner">
                <a class="credit" href="https://mausamgiri.in" target="_blank" rel="noopener noreferrer">
                    <span class="name">Mausam Giri</span>
                    <span class="site">mausamgiri.in</span>
                </a>
                <a class="explore-tools" href="https://tools.mausamgiri.in" target="_blank" rel="noopener noreferrer">
                    Explore Tools
                </a>
            </div>
        </footer>
    </div>

    <div id="note-modal" class="modal hidden">
        <div class="modal-card">
            <h3>Add Note</h3>
            <p id="note-item-title">For: Item Name</p>
            <textarea id="note-input" placeholder="Type your reminder here..."></textarea>
            <div class="modal-actions">
                <button type="button" onclick="closeNoteModal()" class="btn-text">Cancel</button>
                <button type="button" onclick="saveNote()" class="btn-primary">Save Note</button>
            </div>
        </div>
    </div>

    <script src="/ws-pre-departure/script.js"></script>
</body>

</html>
